; PlatformIO project configuration for the W17 ESP32 #2 "sound + light" firmware.
; See CLAUDE.md for the brief; the input protocol is docs/link2_protocol.md
; (copied from the control repo -- the sender side lives there).

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Pinned so "Arduino core 2.0.17 / IDF 4.4 legacy I2S driver" stays a fact,
; not a hope (the audio HAL depends on driver/i2s.h semantics).
platform = espressif32 @ ~7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Bench-demo build: scripted VehicleState frames injected through the real
; byte-stream parser path -- sound + lights run standalone with no board #1.
[env:esp32dev_sim]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DW17_SIM_LINK2_FEEDER

; Host-side Unity tests over the pure libs (link2, link2monitor, enginesim,
; soundsynth, lights). Hardware code lives in *_hal_esp32 libs, referenced
; only from src/main.cpp.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
test_framework = unity
test_build_src = no
lib_ignore =
    audio_hal_esp32
    lights_hal_esp32
