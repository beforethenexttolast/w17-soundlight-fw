name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Native unit tests
        run: pio test -e native

      - name: Build firmware (esp32dev)
        run: pio run -e esp32dev

      - name: Build firmware (Wokwi sim variant)
        run: pio run -e esp32dev_sim

      # Delivery-shape guard (sl:safety-5). platformio.ini and
      # SimLink2Feeder.hpp both promise the sim feeder "vanishes from the real
      # firmware"; this asserts it over the linked ELF instead of asking CI to
      # take a comment's word for it. Runs after BOTH builds because the sim
      # image is the script's positive control: if the marker is missing there
      # too, the run is "could not check" (exit 2), never a pass. Exit 1
      # ("the wrong thing shipped") and exit 2/3 ("the check did not run") are
      # different failures and CI must tell them apart -- same case-statement
      # discipline as the link2-drift job below, instead of collapsing every
      # non-zero exit under bash -e's default anonymous red X.
      - name: Delivery image shape (no sim feeder in esp32dev)
        run: |
          set +e
          bash tools/delivery_shape_check.sh
          rc=$?
          case "$rc" in
            0)
              echo "delivery shape guard: PASS — no sim feeder in the delivery image."
              ;;
            1)
              echo "::error title=SIM FEEDER IN THE DELIVERY IMAGE::the delivery ELF carries the sim feeder or its boot banner (see script output above). This build plays scripted 'armed' link2 frames with no board #1 attached and must never reach the car."
              exit 1
              ;;
            2)
              echo "::error title=delivery shape guard COULD NOT CHECK::the guard did not complete — this is NEITHER a pass NOR a fail. Typically a missing/unreadable/zero-byte ELF, no usable nm, or the sim positive control came up empty. Fix the setup and re-run; a guard that cannot run has proven nothing. Do not merge assuming this job was green."
              exit 1
              ;;
            3)
              echo "::error title=delivery shape guard usage error::delivery_shape_check.sh rejected its arguments (exit 3). This CI invocation and the script's interface have gone out of step — a CI bug, not a shipped defect."
              exit 1
              ;;
            *)
              echo "::error title=delivery shape guard unexpected exit $rc::Unrecognized exit code from delivery_shape_check.sh. Treating as failure."
              exit 1
              ;;
          esac

  # link2 drift guard (audit R06). `lib/link2/` here is a VERBATIM COPY of the
  # shared subset of w17-control-fw's `lib/link2/` — control-fw owns the protocol,
  # this board is only the receiver. The copy is permanent by decision
  # (2026-07-25), so it is guarded rather than shared.
  #
  # The checker itself lives in the OWNER repo (`tools/link2_copy_check.sh`) and is
  # deliberately NOT forked here: a drift checker kept in two copies can drift from
  # itself, which is the one bug it exists to catch. So this job fetches control-fw
  # and runs ITS script. That trades a build-time dependency on the sibling's main
  # for a single source of truth — and the dependency fails loudly (exit 2, "could
  # not check") rather than silently passing, which is the whole point of --strict.
  #
  # Both repos are public, so an anonymous shallow clone avoids any cross-repo
  # token-scope question. It lands outside GITHUB_WORKSPACE so the sibling checkout
  # can never be mistaken for part of this repo's source tree.
  link2-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch w17-control-fw (protocol owner; carries the checker)
        run: |
          git clone --depth 1 \
            https://github.com/beforethenexttolast/w17-control-fw.git \
            "$RUNNER_TEMP/w17-control-fw"

      - name: link2 copy check (strict)
        run: |
          # NOTE: no `set -e`. GitHub's default shell is `bash -e`, which would abort
          # this step the instant the script exits non-zero — collapsing "drifted"
          # and "could not check" into one anonymous red X. Disabling it is what lets
          # the case statement below tell the two apart.
          set +e
          set -uo pipefail

          script="$RUNNER_TEMP/w17-control-fw/tools/link2_copy_check.sh"
          if [ ! -f "$script" ]; then
            echo "::error title=link2 guard COULD NOT CHECK::tools/link2_copy_check.sh is absent from w17-control-fw@main (moved, renamed, or removed). The guard did not run: this is NEITHER a pass NOR drift. Do not merge assuming this job was green."
            exit 1
          fi

          out="$(mktemp)"
          bash "$script" --strict --sibling "$GITHUB_WORKSPACE" 2>&1 | tee "$out"
          rc="${PIPESTATUS[0]}"

          case "$rc" in
            0)
              # The doc is the script's second, non-fatal tier: it legitimately
              # carries repo-local prose, so byte-identity is the wrong bar. Surface
              # it as a warning so "reported" does not mean "invisible".
              if grep -q 'REPORT --' "$out"; then
                echo "::warning title=link2 protocol doc differs::The 4 shared CODE files match, but docs/link2_protocol.md differs from control-fw's copy. Non-fatal by design — but check by hand that nothing NORMATIVE drifted (field table, lengths, CRC, the 500 ms staleness rule)."
              fi
              echo "link2 drift guard: PASS — all 4 shared link2 code files byte-identical to w17-control-fw@main."
              ;;
            1)
              echo "::error title=link2 DRIFT::A shared link2 code file differs from w17-control-fw@main (diff above). link2 is a copied contract: land the change in control-fw FIRST, then re-copy the shared subset here. A brief red here is expected until both mains carry the matching change."
              exit 1
              ;;
            2)
              echo "::error title=link2 guard COULD NOT CHECK::The guard did not complete — this is NEITHER a pass NOR drift. Typically a missing/unreadable checkout, or lib/link2 absent on one side. Fix the setup and re-run; a guard that cannot run has proven nothing."
              exit 1
              ;;
            3)
              echo "::error title=link2 guard usage error::link2_copy_check.sh rejected its arguments (exit 3). This CI invocation and the script's interface have gone out of step — a CI bug, not protocol drift."
              exit 1
              ;;
            *)
              echo "::error title=link2 guard unexpected exit $rc::Unrecognized exit code from link2_copy_check.sh. Treating as failure."
              exit 1
              ;;
          esac
